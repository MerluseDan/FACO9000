name: faco_crumble_mobile
version: 0.6.1+2
description: FACO Crumble mobile-hosted ephemeral private voice, video and messaging.
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  qr_flutter: 4.1.0
  url_launcher: ^6.3.2
  mobile_scanner: ^7.4.2
  cloudflared_tunnel: 1.0.1
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
dev_dependencies:
  async: ^2.12.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/web/

flutter_launcher_icons:
  android: true
  image_path: assets/icon/faco.png
  adaptive_icon_background: '#E5F3FF'
  adaptive_icon_foreground: assets/icon/faco.png
